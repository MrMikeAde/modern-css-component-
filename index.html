<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Modern CSS Components - Free Copy-Paste UI Elements</title>
  <meta name="description" content="Discover a premium open-source collection of 80 responsive, accessible, and beautifully crafted HTML5 and CSS3 components. Copy-paste buttons, cards, forms, and more without dependencies.">
  <meta name="keywords" content="CSS, HTML, component library, UI design, web development, buttons, cards, forms, copy paste CSS, modern styling">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://modern-css-components.netlify.app/">
  <meta property="og:title" content="Modern CSS Components - Premium HTML5 & CSS3 Library">
  <meta property="og:description" content="A premium catalog of responsive, accessible component structures written entirely in semantic HTML5 and CSS3. Copy, paste, and ship.">
  <meta property="og:image" content="https://picsum.photos/id/48/1200/630">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://modern-css-components.netlify.app/">
  <meta property="twitter:title" content="Modern CSS Components - Free CSS Library">
  <meta property="twitter:description" content="Discover 80+ copy-paste semantic components. Optimized for performance, ease of use, and modern design principles.">
  <meta property="twitter:image" content="https://picsum.photos/id/48/1200/630">

  <!-- Favicon Placeholder -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">

  <!-- Global App Styles -->
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="full-width-layout">

  <!-- Keyboard Accessibility Skip Link -->
  <a href="#main-content-target" class="skip-to-content">Skip to content</a>

  <div class="app-shell" id="app-root">

    <!-- Sticky Universal Header Navigation -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <!-- Mobile Drawer Trigger Button -->
          <button class="menu-burger-btn" id="burger-menu-btn" aria-label="Open sidebar menu" aria-haspopup="true">
            ☰
          </button>
          <a href="#" class="logo" id="logo-anchor">
            <span class="logo-icon">🎨</span>
            <span class="logo-text">ModernCSS<span>.io</span></span>
          </a>
        </div>

        <!-- Desktop Navigation Links -->
        <nav class="desktop-nav-wrapper" aria-label="Main Navigation">
          <ul class="desktop-nav">
            <li><a href="#" class="active" id="nav-home">Home</a></li>
            <li><a href="#category/buttons" id="nav-components">Components</a></li>
            <li><a href="#getting-started" id="nav-getstarted">Docs</a></li>
          </ul>
        </nav>

        <!-- Right Side Header Utility Controls -->
        <div class="header-right">
          <!-- Live Interactive Search Button -->
          <button class="top-search-trigger" id="top-search-bar-trigger" aria-label="Search components instantly">
            🔍 <span class="top-search-text">Search...</span>
            <kbd class="top-search-kbd">/</kbd>
          </button>

          <!-- Light/Dark Mode Switcher -->
          <button class="icon-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Light or Dark Mode">
            🌙
          </button>

          <!-- GitHub Source Code link -->
          <a href="https://github.com/modern-css-components" class="icon-btn" target="_blank" rel="noopener noreferrer" title="View Source on GitHub" aria-label="View Source on GitHub">
            🐙
          </a>
        </div>
      </div>
    </header>

    <!-- App Content Wrapper -->
    <div class="app-container">

      <!-- Sticky Sidebar Navigation List -->
      <aside class="app-sidebar" aria-label="Component Navigation Sidebar">
        <div class="sidebar-heading">Completed Catalog (3)</div>
        <ul class="sidebar-menu" id="sidebar-completed-categories">
          <!-- Dynamic Completed items will be written here -->
        </ul>

        <div class="sidebar-heading">Upcoming Roadmap (17)</div>
        <ul class="sidebar-menu" id="sidebar-upcoming-categories">
          <!-- Dynamic Upcoming items will be written here -->
        </ul>
      </aside>

      <!-- Main Dynamic Content Container -->
      <main class="app-main" id="main-content-target" tabindex="-1">
        <!-- Content gets injected dynamically here via Router -->
      </main>

    </div>

  </div>

  <!-- Mobile Drawer Menu Overlay -->
  <div class="mobile-sidebar-drawer" id="mobile-sidebar-drawer-overlay" aria-hidden="true" role="dialog">
    <div class="drawer-content">
      <div class="drawer-header">
        <a href="#" class="logo">
          <span class="logo-icon">🎨</span>
          <span class="logo-text">ModernCSS<span>.io</span></span>
        </a>
        <button class="drawer-close-btn" id="drawer-close-trigger-btn" aria-label="Close sidebar menu">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="sidebar-heading" style="padding-left:0;">Main Links</div>
        <ul class="sidebar-menu" style="margin-bottom:1.5rem;">
          <li><a href="#" class="sidebar-item-link" id="mobile-nav-home">🏠 Home Base</a></li>
          <li><a href="#getting-started" class="sidebar-item-link" id="mobile-nav-started">🚀 Getting Started</a></li>
        </ul>
        <div class="sidebar-heading" style="padding-left:0;">Categories</div>
        <ul class="sidebar-menu" id="mobile-sidebar-categories-list">
          <!-- Dynamic categories injected here -->
        </ul>
      </div>
    </div>
  </div>

  <!-- Copy Clipboard Toast Container -->
  <div class="toast-container" id="toast-alerts-container" aria-live="polite"></div>

  <!-- Component Data Source -->
  <script src="assets/data.js"></script>

  <!-- Core Single Page Application Navigation & Rendering Script -->
  <script src="assets/app.js"></script>
</body>
</html>
